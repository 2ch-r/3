name: Build AnimationController v3 Minimal

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build MHWAnimationController.csproj -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AnimationController-v3-Minimal
          path: bin/Release/net8.0/AnimationController.dll
